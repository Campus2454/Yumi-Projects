# NodeLink (primary node) + self-hosted yt-cipher.
# Pinned to a release commit. Do not bump without running sidecar health checks first
# (several NodeLink releases shipped memory leaks). Upgrade = change NODELINK_REF, rebuild, watch 24h.
#
#   cp .env.example .env && docker compose up -d --build
#
# Note: NodeLink's Dockerfile runs `npm install` without a lockfile and some deps point at
# GitHub branches, so a rebuild of the same ref can still pull newer deps. Keep the built image
# (tag below) and only rebuild on purpose.
services:
  nodelink:
    build:
      context: https://github.com/PerformanC/NodeLink.git#${NODELINK_REF:-cdb02c6814fd8abe37f1d02955770e51b1414d06}
    image: yumi/nodelink:${NODELINK_TAG:-v3.9.0}
    container_name: yumi_nodelink
    restart: unless-stopped
    # Hard cap so a leak restarts the container instead of starving the host.
    mem_limit: ${NODELINK_MEM_LIMIT:-1536m}
    ports:
      - "${NODELINK_PORT:-3000}:3000"
    environment:
      NODELINK_SERVER_HOST: "0.0.0.0"
      NODELINK_SERVER_PORT: "3000"
      NODELINK_SERVER_PASSWORD: ${NODELINK_PASSWORD:?set NODELINK_PASSWORD}
      NODELINK_LOGGING_LEVEL: ${NODELINK_LOG_LEVEL:-info}
      NODELINK_CLUSTER_ENABLED: "true"
      NODELINK_CLUSTER_WORKERS: ${NODELINK_WORKERS:-2}

      # YouTube
      NODELINK_SOURCES_YOUTUBE_ENABLED: ${YT_ENABLED:-true}
      NODELINK_SOURCES_YOUTUBE_HL: "en"
      NODELINK_SOURCES_YOUTUBE_GL: ${YT_GL:-TH}
      # true once: NodeLink prints a device-login link in the logs. Log in with the BURNER account,
      # copy the refresh token into YT_REFRESH_TOKENS, then set back to false.
      NODELINK_SOURCES_YOUTUBE_GETOAUTHTOKEN: ${YT_GET_OAUTH_TOKEN:-false}
      # JSON array, one token per burner account (2 recommended).
      NODELINK_SOURCES_YOUTUBE_CLIENTS_SETTINGS_TV_REFRESHTOKEN: ${YT_REFRESH_TOKENS:-[""]}
      NODELINK_SOURCES_YOUTUBE_CLIENTS_SEARCH: ${YT_CLIENTS_SEARCH:-["Android"]}
      NODELINK_SOURCES_YOUTUBE_CLIENTS_PLAYBACK: ${YT_CLIENTS_PLAYBACK:-["VisionOs","AndroidVR","TV_DOWN","TV","TVCast","WebEmbedded","WebParentTools","Web","IOS"]}
      # With network_mode: host use http://127.0.0.1:8001
      NODELINK_SOURCES_YOUTUBE_CIPHER_URL: ${YT_CIPHER_URL:-http://yt-cipher:8001}
      # YouTube-only proxies (JSON array of URLs). Empty = direct. Residential proxy goes here
      # only while YouTube blocks hard, it bills by traffic.
      NODELINK_SOURCES_YOUTUBE_PROXIES: ${YT_PROXIES:-[]}

      # Search: the bot always sends an explicit prefix, these are only for direct API users.
      NODELINK_SEARCH_DEFAULTSOURCE: '["soundcloud","youtube"]'

      # IPv6 rotation. Needs network_mode: host (see below) and the block routed to this host.
      # Applies to all outbound NodeLink requests, not only YouTube.
      NODELINK_NETWORK_ROUTEPLANNER_STRATEGY: ${ROUTEPLANNER_STRATEGY:-RotateOnBan}
      NODELINK_NETWORK_ROUTEPLANNER_IPBLOCKS: ${ROUTEPLANNER_IPBLOCKS:-[]}

      NODELINK_API_METRICS_ENABLED: "true"
      NODELINK_API_METRICS_AUTHORIZATION_PASSWORD: ${NODELINK_PASSWORD}
    # For IPv6 rotation uncomment, remove `ports`, and set NODELINK_PORT in the bot instead.
    # network_mode: host
    depends_on:
      - yt-cipher
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/version',{headers:{Authorization:process.env.NODELINK_SERVER_PASSWORD}}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  yt-cipher:
    # Only published tag is `master`, so pin by digest. Update digest on purpose.
    image: ghcr.io/kikkia/yt-cipher@${YT_CIPHER_DIGEST:-sha256:4c5ec381ff57336cfc24822d2b526a5ad7cd0171f61065a1bbc87bb736842449}
    container_name: yumi_nodelink_cipher
    restart: unless-stopped
    environment:
      - OVERRIDE_PLAYER_VARIANT=IAS
    # Bound to loopback only, so no API_TOKEN needed. NodeLink reaches it by service name
    # (bridge network) or 127.0.0.1 (host network).
    ports:
      - "127.0.0.1:${YT_CIPHER_PORT:-8001}:8001"
